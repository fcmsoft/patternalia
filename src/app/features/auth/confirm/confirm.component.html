<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm">
    <h1 class="text-3xl font-bold text-center text-indigo-600 mb-2">🧶 Patternalia</h1>
    <p class="text-center text-gray-500 mb-8 text-sm">
      Enter the confirmation code sent to your email
    </p>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="bg-white shadow rounded-xl p-8 space-y-5"
      novalidate
    >
      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" />
      }
      @if (successMessage()) {
        <p-message severity="success" [text]="successMessage()!" />
      }

      <div class="flex flex-col gap-1">
        <label for="email" class="text-sm font-medium text-gray-700">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          class="w-full"
          aria-required="true"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="code" class="text-sm font-medium text-gray-700">Confirmation code</label>
        <input
          pInputText
          id="code"
          type="text"
          formControlName="code"
          autocomplete="one-time-code"
          class="w-full"
          aria-required="true"
          inputmode="numeric"
        />
        @if (form.controls.code.invalid && form.controls.code.touched) {
          <small class="text-red-600">Confirmation code is required.</small>
        }
      </div>

      <button
        pButton
        type="submit"
        label="Confirm account"
        [loading]="loading()"
        [disabled]="form.invalid"
        class="w-full"
      ></button>

      <p class="text-center text-sm text-gray-500">
        <a
          routerLink="/auth/login"
          class="text-indigo-600 hover:underline focus:outline-none focus:ring-1 focus:ring-indigo-500 rounded"
        >
          Back to sign in
        </a>
      </p>
    </form>
  </div>
</div>
