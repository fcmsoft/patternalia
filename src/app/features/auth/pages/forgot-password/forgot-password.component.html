<div class="min-h-screen flex items-center justify-center bg-gray-50 px-4">
  <div class="w-full max-w-sm">
    <h1 class="text-3xl font-bold text-center text-indigo-600 mb-2">🧶 Patternalia</h1>

    @if (!codeSent()) {
      <p class="text-center text-gray-500 mb-8 text-sm">Reset your password</p>
      <form
        [formGroup]="requestForm"
        (ngSubmit)="sendCode()"
        class="bg-white shadow rounded-xl p-8 space-y-5"
        novalidate
      >
        @if (errorMessage()) {
          <p-message severity="error" [text]="errorMessage()!" />
        }
        <div class="flex flex-col gap-1">
          <label for="email" class="text-sm font-medium text-gray-700">Email</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            class="w-full"
            aria-required="true"
          />
        </div>
        <button
          pButton
          type="submit"
          label="Send reset code"
          [loading]="loading()"
          [disabled]="requestForm.invalid"
          class="w-full"
        ></button>
        <p class="text-center text-sm">
          <a
            routerLink="/auth/login"
            class="text-indigo-600 hover:underline focus:outline-none focus:ring-1 focus:ring-indigo-500 rounded"
            >Back to sign in</a
          >
        </p>
      </form>
    } @else {
      <p class="text-center text-gray-500 mb-8 text-sm">Enter the code sent to your email</p>
      <form
        [formGroup]="resetForm"
        (ngSubmit)="resetPassword()"
        class="bg-white shadow rounded-xl p-8 space-y-5"
        novalidate
      >
        @if (errorMessage()) {
          <p-message severity="error" [text]="errorMessage()!" />
        }
        @if (successMessage()) {
          <p-message severity="success" [text]="successMessage()!" />
        }
        <div class="flex flex-col gap-1">
          <label for="code" class="text-sm font-medium text-gray-700">Reset code</label>
          <input
            pInputText
            id="code"
            type="text"
            formControlName="code"
            autocomplete="one-time-code"
            class="w-full"
            aria-required="true"
            inputmode="numeric"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label for="newPassword" class="text-sm font-medium text-gray-700">New password</label>
          <p-password
            inputId="newPassword"
            formControlName="newPassword"
            [toggleMask]="true"
            autocomplete="new-password"
            styleClass="w-full"
            inputStyleClass="w-full"
            aria-required="true"
          />
        </div>
        <button
          pButton
          type="submit"
          label="Reset password"
          [loading]="loading()"
          [disabled]="resetForm.invalid"
          class="w-full"
        ></button>
      </form>
    }
  </div>
</div>
