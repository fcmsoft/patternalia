<form [formGroup]="form" (ngSubmit)="save()" class="space-y-4" novalidate>
  <div class="flex items-center justify-between gap-2">
    <h2 class="font-semibold text-gray-700">Edit pattern</h2>
  </div>

  <div class="flex flex-col gap-1">
    <label for="edit-title" class="text-sm font-medium text-gray-700"
      >Title <span aria-hidden="true" class="text-red-500">*</span></label
    >
    <input
      pInputText
      id="edit-title"
      type="text"
      formControlName="title"
      class="w-full"
      aria-required="true"
      maxlength="120"
    />
    @if (form.controls.title.invalid && form.controls.title.touched) {
      <small class="text-red-600">Title is required.</small>
    }
  </div>

  <div class="flex flex-col gap-1">
    <label for="edit-description" class="text-sm font-medium text-gray-700">Description</label>
    <textarea
      pTextarea
      id="edit-description"
      formControlName="description"
      rows="3"
      class="w-full"
    ></textarea>
  </div>

  <div class="flex flex-col gap-1">
    <label for="edit-craft" class="text-sm font-medium text-gray-700"
      >Craft <span aria-hidden="true" class="text-red-500">*</span></label
    >
    <p-select
      inputId="edit-craft"
      formControlName="craft"
      [options]="craftOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Select craft"
      styleClass="w-full"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="edit-categories" class="text-sm font-medium text-gray-700">Categories</label>
    <p-multiselect
      inputId="edit-categories"
      formControlName="categoryIds"
      [options]="categories()"
      optionLabel="name"
      optionValue="id"
      placeholder="Select categories"
      styleClass="w-full"
      display="chip"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="edit-notes" class="text-sm font-medium text-gray-700">Notes</label>
    <textarea pTextarea id="edit-notes" formControlName="notes" rows="4" class="w-full"></textarea>
  </div>

  <!-- Ravelry link -->
  <div class="space-y-2">
    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">🧵 Ravelry link</p>
    <app-ravelry-search
      [linkedPattern]="linkedRavelryPattern()"
      (patternLinked)="linkedRavelryPattern.set($event)"
      (patternUnlinked)="linkedRavelryPattern.set(null)"
    />
  </div>

  <!-- Other links -->
  <div class="space-y-2" formArrayName="otherLinks">
    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Additional links</p>

    @for (_ of otherLinks.controls; track $index; let i = $index) {
      <div [formGroupName]="i" class="border border-gray-200 rounded-lg p-3 space-y-2">
        <div class="flex flex-col gap-1">
          <label [for]="'edit-link-label-' + i" class="text-sm font-medium text-gray-700"
            >Label</label
          >
          <input
            pInputText
            [id]="'edit-link-label-' + i"
            type="text"
            formControlName="label"
            class="w-full"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label [for]="'edit-link-url-' + i" class="text-sm font-medium text-gray-700">URL</label>
          <input
            pInputText
            [id]="'edit-link-url-' + i"
            type="url"
            formControlName="url"
            class="w-full"
          />
        </div>
        <div class="flex justify-end">
          <button
            pButton
            type="button"
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            size="small"
            (click)="removeOtherLink(i)"
            [attr.aria-label]="'Remove link ' + (i + 1)"
          ></button>
        </div>
      </div>
    }
    <button
      pButton
      type="button"
      label="Add link"
      icon="pi pi-plus"
      severity="secondary"
      size="small"
      (click)="addOtherLink()"
    ></button>
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-2 pt-2 border-t border-gray-100">
    <button
      pButton
      type="button"
      label="Cancel"
      severity="secondary"
      size="small"
      (click)="cancelled.emit()"
    ></button>
    <button
      pButton
      type="submit"
      label="Save"
      size="small"
      [loading]="saving()"
      [disabled]="form.invalid"
    ></button>
  </div>
</form>
