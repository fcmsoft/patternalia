@if (linkedPattern(); as rv) {
  <div class="flex items-center justify-between gap-2 bg-indigo-50 rounded-lg px-3 py-2">
    <div class="min-w-0">
      <p class="font-medium text-indigo-800 truncate">{{ rv.name }}</p>
      @if (rv.pattern_author) {
        <p class="text-sm text-indigo-600">by {{ rv.pattern_author.name }}</p>
      }
    </div>
    <button
      pButton
      type="button"
      label="Unlink"
      severity="secondary"
      size="small"
      (click)="patternUnlinked.emit()"
    ></button>
  </div>
} @else {
  <div class="flex gap-2">
    <input
      pInputText
      type="search"
      [value]="query()"
      (input)="onQueryChange($event)"
      [placeholder]="placeholder()"
      class="flex-1 min-w-0"
      aria-label="Search Ravelry"
      (keydown.enter)="search(); $event.preventDefault()"
    />
    <button
      pButton
      type="button"
      icon="pi pi-search"
      label="Search"
      [loading]="searching()"
      (click)="search()"
    ></button>
  </div>

  @if (results().length > 0) {
    <ul
      class="border border-gray-200 rounded-lg divide-y max-h-48 overflow-y-auto"
      role="listbox"
      aria-label="Ravelry results"
    >
      @for (rv of results(); track rv.id) {
        <li>
          <button
            type="button"
            class="w-full text-left px-3 py-2 hover:bg-indigo-50 text-sm focus:outline-none focus:bg-indigo-50"
            (click)="select(rv)"
            role="option"
            [attr.aria-selected]="false"
          >
            <span class="font-medium">{{ rv.name }}</span>
            @if (rv.pattern_author) {
              <span class="text-gray-500"> — {{ rv.pattern_author.name }}</span>
            }
          </button>
        </li>
      }
    </ul>
  }
}
